<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Homeschool Book Scanner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 20px 0;
      color: white;
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      padding: 4px 12px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
    }

    .status-dot.disconnected {
      background: #ef4444;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }

    #reader video {
      border-radius: 12px;
    }

    .scan-hint {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    .book-preview {
      display: none;
    }

    .book-preview.active {
      display: block;
    }

    .book-info {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }

    .book-cover {
      width: 80px;
      height: 120px;
      background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-details h3 {
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .book-details p {
      color: #666;
      font-size: 0.9rem;
    }

    .book-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .meta-tag {
      background: #f3f4f6;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      color: #555;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #333;
      margin-top: 10px;
    }

    .btn-photo {
      background: #fff;
      border: 2px dashed #ccc;
      color: #666;
      margin-top: 10px;
    }

    .success-toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #059669;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 500;
      display: none;
      animation: slideUp 0.3s ease;
      z-index: 100;
    }

    .success-toast.show {
      display: block;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .error {
      background: #fef2f2;
      color: #dc2626;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 15px;
    }

    .manual-entry {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .manual-entry input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .manual-entry input:focus {
      outline: none;
      border-color: #667eea;
    }

    .stats {
      text-align: center;
      padding: 10px;
      color: white;
      font-size: 0.9rem;
    }

    .hidden {
      display: none !important;
    }

    #photoInput {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Homeschool Book Scanner</h1>
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </header>

    <div id="errorBox" class="error hidden"></div>

    <div class="card" id="scannerCard">
      <div id="reader"></div>
      <p class="scan-hint">Point camera at a book barcode</p>
    </div>

    <div class="card book-preview" id="bookPreview">
      <div class="book-info">
        <div class="book-cover" id="bookCover"></div>
        <div class="book-details">
          <h3 id="bookTitle">-</h3>
          <p id="bookAuthor">-</p>
          <div class="book-meta">
            <span class="meta-tag" id="bookPages">- pages</span>
            <span class="meta-tag" id="bookIsbn">ISBN: -</span>
          </div>
        </div>
      </div>

      <button class="btn btn-photo" id="takePhotoBtn">
        Take Cover Photo
      </button>
      <input type="file" accept="image/*" capture="environment" id="photoInput">

      <button class="btn btn-primary" id="addBookBtn">
        Add Book
      </button>
      <button class="btn btn-secondary" id="skipBtn">
        Scan Another
      </button>
    </div>

    <div class="card manual-entry">
      <input type="text" id="manualIsbn" placeholder="Type ISBN manually">
      <button class="btn btn-secondary" id="manualLookupBtn">Look Up ISBN</button>
    </div>

    <div class="stats">
      Books added: <strong id="bookCount">0</strong>
    </div>
  </div>

  <div class="success-toast" id="successToast">Book added!</div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    // Get channel from URL params
    const params = new URLSearchParams(window.location.search);
    const channelId = params.get('channel');

    let currentBook = null;
    let coverPhotoData = null;
    let bookCount = 0;
    let html5QrCode = null;

    // Elements
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const errorBox = document.getElementById('errorBox');
    const scannerCard = document.getElementById('scannerCard');
    const bookPreview = document.getElementById('bookPreview');
    const bookCover = document.getElementById('bookCover');
    const bookTitle = document.getElementById('bookTitle');
    const bookAuthor = document.getElementById('bookAuthor');
    const bookPages = document.getElementById('bookPages');
    const bookIsbn = document.getElementById('bookIsbn');
    const addBookBtn = document.getElementById('addBookBtn');
    const skipBtn = document.getElementById('skipBtn');
    const takePhotoBtn = document.getElementById('takePhotoBtn');
    const photoInput = document.getElementById('photoInput');
    const manualIsbn = document.getElementById('manualIsbn');
    const manualLookupBtn = document.getElementById('manualLookupBtn');
    const bookCountEl = document.getElementById('bookCount');
    const successToast = document.getElementById('successToast');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }

    function hideError() {
      errorBox.classList.add('hidden');
    }

    function showSuccess() {
      successToast.classList.add('show');
      if (navigator.vibrate) navigator.vibrate(100);
      setTimeout(() => successToast.classList.remove('show'), 2000);
    }

    function updateStatus(connected) {
      statusDot.classList.toggle('disconnected', !connected);
      statusText.textContent = connected ? 'Connected' : 'Disconnected';
    }

    // Validate smee channel
    if (!channelId) {
      showError('No channel ID provided. Please scan the QR code from the desktop app.');
      updateStatus(false);
    } else {
      updateStatus(true);
      initScanner();
    }

    async function initScanner() {
      try {
        html5QrCode = new Html5Qrcode("reader");

        await html5QrCode.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 100 },
            aspectRatio: 1.0
          },
          onScanSuccess,
          () => {} // Ignore scan failures
        );
      } catch (err) {
        showError('Camera access denied. Please allow camera permissions.');
        console.error('Scanner init error:', err);
      }
    }

    async function onScanSuccess(decodedText) {
      // Validate ISBN format (10 or 13 digits, may have hyphens)
      const cleanIsbn = decodedText.replace(/[-\s]/g, '');
      if (!/^(\d{10}|\d{13})$/.test(cleanIsbn)) {
        return; // Not a valid ISBN
      }

      // Pause scanner
      if (html5QrCode) {
        await html5QrCode.pause();
      }

      // Vibrate feedback
      if (navigator.vibrate) navigator.vibrate(50);

      // Look up book
      await lookupIsbn(cleanIsbn);
    }

    async function lookupIsbn(isbn) {
      hideError();
      bookTitle.textContent = 'Looking up...';
      bookPreview.classList.add('active');
      scannerCard.classList.add('hidden');

      let bookFound = false;

      // Try Open Library first
      try {
        const response = await fetch(`https://openlibrary.org/isbn/${isbn}.json`);

        if (response.ok) {
          const data = await response.json();

          // Get author info
          let authorName = '';
          if (data.authors && data.authors.length > 0) {
            const authorKey = data.authors[0].key;
            try {
              const authorRes = await fetch(`https://openlibrary.org${authorKey}.json`);
              const authorData = await authorRes.json();
              authorName = authorData.name || '';
            } catch (e) {
              console.warn('Could not fetch author:', e);
            }
          }

          // Build cover URL
          let coverUrl = '';
          if (data.covers && data.covers.length > 0) {
            coverUrl = `https://covers.openlibrary.org/b/id/${data.covers[0]}-M.jpg`;
          }

          currentBook = {
            isbn: isbn,
            title: data.title || 'Unknown Title',
            author: authorName,
            totalPages: data.number_of_pages || null,
            coverUrl: coverUrl,
            coverPhoto: null
          };
          bookFound = true;
        }
      } catch (err) {
        console.warn('Open Library lookup failed:', err);
      }

      // Fallback to Google Books API
      if (!bookFound) {
        try {
          const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
          const data = await response.json();

          if (data.totalItems > 0 && data.items && data.items[0]) {
            const book = data.items[0].volumeInfo;

            currentBook = {
              isbn: isbn,
              title: book.title || 'Unknown Title',
              author: book.authors ? book.authors.join(', ') : '',
              totalPages: book.pageCount || null,
              coverUrl: book.imageLinks?.thumbnail?.replace('http:', 'https:') || '',
              coverPhoto: null
            };
            bookFound = true;
          }
        } catch (err) {
          console.warn('Google Books lookup failed:', err);
        }
      }

      // Update UI based on result
      if (bookFound && currentBook) {
        bookTitle.textContent = currentBook.title;
        bookAuthor.textContent = currentBook.author || 'Unknown Author';
        bookPages.textContent = currentBook.totalPages ? `${currentBook.totalPages} pages` : '? pages';
        bookIsbn.textContent = `ISBN: ${isbn}`;

        if (currentBook.coverUrl) {
          bookCover.innerHTML = `<img src="${currentBook.coverUrl}" alt="Cover">`;
        } else {
          bookCover.innerHTML = '&#128218;';
        }

        coverPhotoData = null;
      } else {
        // No book found in any database - still allow adding with just ISBN
        currentBook = {
          isbn: isbn,
          title: 'Unknown Book',
          author: '',
          totalPages: null,
          coverUrl: '',
          coverPhoto: null
        };

        bookTitle.textContent = 'Book not found - enter details manually';
        bookAuthor.textContent = `ISBN: ${isbn}`;
        bookPages.textContent = '';
        bookIsbn.textContent = '';
        bookCover.innerHTML = '&#128218;';
      }
    }

    // Take photo button
    takePhotoBtn.addEventListener('click', () => {
      photoInput.click();
    });

    photoInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Compress and convert to base64
      const compressed = await compressImage(file, 800);
      coverPhotoData = compressed;

      // Update preview
      bookCover.innerHTML = `<img src="${compressed}" alt="Cover">`;
      takePhotoBtn.textContent = 'Photo taken!';
    });

    async function compressImage(file, maxWidth) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ratio = Math.min(maxWidth / img.width, maxWidth / img.height);
            canvas.width = img.width * ratio;
            canvas.height = img.height * ratio;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // Add book button
    addBookBtn.addEventListener('click', async () => {
      if (!currentBook) return;

      // Add photo if taken
      if (coverPhotoData) {
        currentBook.coverPhoto = coverPhotoData;
      }

      // Send to smee channel
      try {
        await fetch(`https://smee.io/${channelId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'book',
            data: currentBook
          })
        });

        bookCount++;
        bookCountEl.textContent = bookCount;
        showSuccess();

      } catch (err) {
        console.error('Send error:', err);
        showError('Failed to send book. Please try again.');
      }

      // Reset for next scan
      resetScanner();
    });

    // Skip button
    skipBtn.addEventListener('click', resetScanner);

    async function resetScanner() {
      currentBook = null;
      coverPhotoData = null;
      takePhotoBtn.textContent = 'Take Cover Photo';

      bookPreview.classList.remove('active');
      scannerCard.classList.remove('hidden');

      if (html5QrCode) {
        try {
          await html5QrCode.resume();
        } catch (e) {
          // Scanner may need reinit
          await initScanner();
        }
      }
    }

    // Manual ISBN entry
    manualLookupBtn.addEventListener('click', async () => {
      const isbn = manualIsbn.value.replace(/[-\s]/g, '');
      if (!/^(\d{10}|\d{13})$/.test(isbn)) {
        showError('Please enter a valid 10 or 13 digit ISBN');
        return;
      }

      if (html5QrCode) {
        try { await html5QrCode.pause(); } catch (e) {}
      }

      await lookupIsbn(isbn);
      manualIsbn.value = '';
    });

    // Enter key for manual ISBN
    manualIsbn.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        manualLookupBtn.click();
      }
    });
  </script>
</body>
</html>
