<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Releases - Homeschool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      color: white;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    header p {
      opacity: 0.9;
    }

    .back-link {
      display: inline-block;
      color: white;
      text-decoration: none;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    .back-link:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .releases-list {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      margin-bottom: 40px;
    }

    .release {
      border-bottom: 1px solid #eee;
      padding: 25px;
    }

    .release:last-child {
      border-bottom: none;
    }

    .release-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .release-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .release-title h2 {
      font-size: 1.3rem;
      color: #333;
    }

    .badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-latest {
      background: #dcfce7;
      color: #16a34a;
    }

    .badge-draft {
      background: #fef3c7;
      color: #d97706;
    }

    .release-date {
      color: #666;
      font-size: 0.9rem;
    }

    .release-notes {
      color: #555;
      line-height: 1.6;
      margin-bottom: 15px;
      font-size: 0.95rem;
    }

    .release-notes p {
      margin-bottom: 10px;
    }

    .release-notes ul {
      padding-left: 20px;
    }

    .release-notes li {
      margin-bottom: 5px;
    }

    .downloads {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .download-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .download-btn .size {
      opacity: 0.8;
      font-size: 0.8rem;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }

    .error {
      text-align: center;
      padding: 40px 20px;
      color: #dc2626;
      background: #fef2f2;
    }

    .no-releases {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: white;
      opacity: 0.8;
    }

    footer a {
      color: white;
    }

    @media (max-width: 600px) {
      .release-header {
        flex-direction: column;
      }

      .downloads {
        flex-direction: column;
      }

      .download-btn {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="./" class="back-link">&larr; Back to Home</a>

    <header>
      <h1>All Releases</h1>
      <p>Download any version of Homeschool</p>
    </header>

    <div class="releases-list" id="releasesList">
      <div class="loading">Loading releases...</div>
    </div>

    <footer>
      <a href="https://github.com/scoblelife/homeschool/releases">View on GitHub</a>
    </footer>
  </div>

  <script>
    const REPO = 'scoblelife/homeschool';
    const releasesList = document.getElementById('releasesList');

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function getPlatformLabel(filename) {
      const name = filename.toLowerCase();
      if (name.endsWith('.dmg')) return 'macOS';
      if (name.endsWith('.exe')) return 'Windows';
      if (name.endsWith('.appimage')) return 'Linux (AppImage)';
      if (name.endsWith('.deb')) return 'Linux (Deb)';
      return filename;
    }

    function getPlatformIcon(filename) {
      const name = filename.toLowerCase();
      if (name.endsWith('.dmg')) return '🍎';
      if (name.endsWith('.exe')) return '🪟';
      if (name.includes('linux') || name.endsWith('.appimage') || name.endsWith('.deb')) return '🐧';
      return '📦';
    }

    function renderRelease(release, isLatest) {
      const assets = release.assets.filter(a => {
        const name = a.name.toLowerCase();
        return name.endsWith('.dmg') || name.endsWith('.exe') ||
               name.endsWith('.appimage') || name.endsWith('.deb');
      });

      if (assets.length === 0 && release.draft) {
        return ''; // Skip drafts with no assets
      }

      const badges = [];
      if (isLatest && !release.draft) {
        badges.push('<span class="badge badge-latest">Latest</span>');
      }
      if (release.draft) {
        badges.push('<span class="badge badge-draft">Draft</span>');
      }

      const downloadsHtml = assets.map(asset => `
        <a href="${asset.browser_download_url}" class="download-btn">
          ${getPlatformIcon(asset.name)} ${getPlatformLabel(asset.name)}
          <span class="size">${formatSize(asset.size)}</span>
        </a>
      `).join('');

      // Parse release notes (basic markdown to HTML)
      let notesHtml = '';
      if (release.body) {
        notesHtml = release.body
          .replace(/^### (.+)$/gm, '<strong>$1</strong>')
          .replace(/^- (.+)$/gm, '<li>$1</li>')
          .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
          .replace(/\n\n/g, '</p><p>')
          .replace(/\n/g, '<br>');
        notesHtml = `<div class="release-notes"><p>${notesHtml}</p></div>`;
      }

      return `
        <div class="release">
          <div class="release-header">
            <div class="release-title">
              <h2>${release.tag_name}</h2>
              ${badges.join('')}
            </div>
            <span class="release-date">${formatDate(release.published_at || release.created_at)}</span>
          </div>
          ${notesHtml}
          <div class="downloads">
            ${downloadsHtml || '<span style="color: #999;">No downloads available</span>'}
          </div>
        </div>
      `;
    }

    async function loadReleases() {
      try {
        const response = await fetch(`https://api.github.com/repos/${REPO}/releases`);
        if (!response.ok) {
          throw new Error('Failed to fetch releases');
        }

        const releases = await response.json();

        if (releases.length === 0) {
          releasesList.innerHTML = '<div class="no-releases">No releases yet. Check back soon!</div>';
          return;
        }

        // Find first non-draft for "latest" badge
        const latestIndex = releases.findIndex(r => !r.draft);

        const html = releases
          .map((r, i) => renderRelease(r, i === latestIndex))
          .filter(Boolean)
          .join('');

        if (html) {
          releasesList.innerHTML = html;
        } else {
          releasesList.innerHTML = '<div class="no-releases">No releases available yet.</div>';
        }

      } catch (err) {
        console.error('Failed to load releases:', err);
        releasesList.innerHTML = `
          <div class="error">
            Failed to load releases.
            <a href="https://github.com/${REPO}/releases">View on GitHub</a>
          </div>
        `;
      }
    }

    loadReleases();
  </script>
</body>
</html>
