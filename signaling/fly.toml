# fly.toml app configuration file generated for homeschool-signaling on 2026-01-11T20:50:47-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'homeschool-signaling'
primary_region = 'sjc'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

# Scale to exactly 1 machine (Rust is lightweight, no need for 2)
[machines]
  count = 1
