name = "homeschool-sync"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# ============= Production Environment =============
# Default environment - deployed to homeschool-sync.workers.dev
[[kv_namespaces]]
binding = "KV"
id = "3a77218bb64b4d79b3713efcd427f8bb"

# ============= Staging Environment =============
[env.staging]
name = "homeschool-sync-staging"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "34535f8375fc4a01b63052ec7f79969e"

# ============= Local Development =============
# For local dev, wrangler will create a local KV store automatically
# Run: npx wrangler dev
