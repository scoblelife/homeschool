name: Mobile Build

# Two build strategies:
#   --local (default): Builds on CI runner — zero EAS credits consumed
#   EAS cloud: Builds on EAS servers — uses credits but more reliable
#
# Runner strategy:
#   - Type check + Android local build: Depot Linux
#   - iOS local build: GitHub macOS (has Xcode)
#   - EAS cloud builds + store submission: Depot Linux (just triggers EAS)
#
# Setup required:
#   1. Set EXPO_TOKEN secret in GitHub repo settings
#   2. Run `eas credentials` locally once to set up signing credentials
#   3. For Play Store: upload service account JSON to EAS secrets

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared-types/**'
      - 'packages/design-tokens/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared-types/**'
      - 'packages/design-tokens/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      build_mode:
        description: 'Build mode'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - cloud
      submit:
        description: 'Submit to stores after build'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  BUILD_PROFILE: ${{ github.event.inputs.profile || 'preview' }}
  BUILD_MODE: ${{ github.event.inputs.build_mode || 'local' }}

jobs:
  # ──────────────────────────────────────────────────
  # Type check (runs on every push + PR)
  # ──────────────────────────────────────────────────
  typecheck:
    runs-on: depot-ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @homeschool/mobile typecheck

  # ──────────────────────────────────────────────────
  # Android build — local on Depot Linux
  # ──────────────────────────────────────────────────
  build-android-local:
    if: |
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'))
      ) && (github.event.inputs.build_mode || 'local') == 'local'
    needs: typecheck
    runs-on: depot-ubuntu-24.04-arm
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build Android (APK for preview, AAB for production)
        run: |
          if [ "$BUILD_PROFILE" = "production" ]; then
            eas build --platform android --profile $BUILD_PROFILE --local --non-interactive --output ./build-android.aab
          else
            eas build --platform android --profile $BUILD_PROFILE --local --non-interactive --output ./build-android.apk
          fi
        env:
          HYPERSWARM_NATIVE: '0'

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.BUILD_PROFILE }}
          path: |
            apps/mobile/build-android.apk
            apps/mobile/build-android.aab
          if-no-files-found: error

  # ──────────────────────────────────────────────────
  # iOS build — local on macOS runner
  # ──────────────────────────────────────────────────
  build-ios-local:
    if: |
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios'))
      ) && (github.event.inputs.build_mode || 'local') == 'local'
    needs: typecheck
    runs-on: depot-ubuntu-24.04-arm
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build iOS locally
        run: eas build --platform ios --profile ${{ env.BUILD_PROFILE }} --local --non-interactive --output ./build-ios.ipa
        env:
          HYPERSWARM_NATIVE: '0'

      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ env.BUILD_PROFILE }}
          path: apps/mobile/build-ios.ipa

  # ──────────────────────────────────────────────────
  # EAS cloud builds — triggers builds on EAS servers
  # More reliable, uses EAS build credits
  # ──────────────────────────────────────────────────
  build-cloud:
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.build_mode == 'cloud'
    needs: typecheck
    runs-on: depot-ubuntu-24.04-arm
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Determine platforms
        id: platforms
        run: |
          PLATFORM="${{ github.event.inputs.platform }}"
          if [ "$PLATFORM" = "all" ]; then
            echo "flags=--platform all" >> $GITHUB_OUTPUT
          else
            echo "flags=--platform $PLATFORM" >> $GITHUB_OUTPUT
          fi

      - name: Build on EAS
        run: eas build ${{ steps.platforms.outputs.flags }} --profile ${{ env.BUILD_PROFILE }} --non-interactive --no-wait
        env:
          HYPERSWARM_NATIVE: '0'

  # ──────────────────────────────────────────────────
  # Submit iOS to App Store / TestFlight
  # ──────────────────────────────────────────────────
  submit-ios:
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.submit == 'true' &&
      (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all')
    needs: build-ios-local
    runs-on: depot-ubuntu-24.04-arm
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: ios-${{ env.BUILD_PROFILE }}
          path: apps/mobile/

      - name: Submit to App Store Connect
        run: eas submit --platform ios --path ./build-ios.ipa --profile ${{ env.BUILD_PROFILE }} --non-interactive

  # ──────────────────────────────────────────────────
  # Submit Android to Google Play
  # ──────────────────────────────────────────────────
  submit-android:
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.submit == 'true' &&
      (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all')
    needs: build-android-local
    runs-on: depot-ubuntu-24.04-arm
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: android-${{ env.BUILD_PROFILE }}
          path: apps/mobile/

      - name: Submit to Google Play
        run: |
          if [ -f ./build-android.aab ]; then
            eas submit --platform android --path ./build-android.aab --profile ${{ env.BUILD_PROFILE }} --non-interactive
          else
            eas submit --platform android --path ./build-android.apk --profile ${{ env.BUILD_PROFILE }} --non-interactive
          fi
