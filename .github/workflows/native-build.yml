name: Build Native Libraries

on:
  push:
    branches: [main]
    paths:
      - 'native/hyperswarm-mobile/**'
  pull_request:
    branches: [main]
    paths:
      - 'native/hyperswarm-mobile/**'
  workflow_dispatch:
  # Allow triggering from mobile-build workflow
  workflow_call:
    outputs:
      artifact-url:
        description: 'URL to download native libraries'
        value: ${{ jobs.package.outputs.artifact-url }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    name: Build Android (${{ matrix.target }})
    runs-on: depot-ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            arch: arm64-v8a
          - target: armv7-linux-androideabi
            arch: armeabi-v7a
          - target: x86_64-linux-android
            arch: x86_64
          - target: i686-linux-android
            arch: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/hyperswarm-mobile
          key: android-${{ matrix.target }}

      - name: Build for ${{ matrix.target }}
        working-directory: native/hyperswarm-mobile
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t ${{ matrix.target }} build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}
          path: native/hyperswarm-mobile/target/${{ matrix.target }}/release/libhyperswarm_mobile.so

  build-ios:
    name: Build iOS (${{ matrix.target }})
    runs-on: macos-14  # M1 runner for arm64
    strategy:
      matrix:
        include:
          - target: aarch64-apple-ios
            platform: iphoneos
          - target: aarch64-apple-ios-sim
            platform: iphonesimulator
          - target: x86_64-apple-ios
            platform: iphonesimulator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/hyperswarm-mobile
          key: ios-${{ matrix.target }}

      - name: Build for ${{ matrix.target }}
        working-directory: native/hyperswarm-mobile
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.target }}
          path: native/hyperswarm-mobile/target/${{ matrix.target }}/release/libhyperswarm_mobile.a

  package:
    name: Package Libraries
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create directory structure
        run: |
          mkdir -p output/android/jniLibs/arm64-v8a
          mkdir -p output/android/jniLibs/armeabi-v7a
          mkdir -p output/android/jniLibs/x86_64
          mkdir -p output/android/jniLibs/x86
          mkdir -p output/ios/device
          mkdir -p output/ios/simulator

          # Android
          cp artifacts/android-arm64-v8a/libhyperswarm_mobile.so output/android/jniLibs/arm64-v8a/
          cp artifacts/android-armeabi-v7a/libhyperswarm_mobile.so output/android/jniLibs/armeabi-v7a/
          cp artifacts/android-x86_64/libhyperswarm_mobile.so output/android/jniLibs/x86_64/
          cp artifacts/android-x86/libhyperswarm_mobile.so output/android/jniLibs/x86/

          # iOS - device
          cp artifacts/ios-aarch64-apple-ios/libhyperswarm_mobile.a output/ios/device/

          # iOS - simulator (create fat library)
          lipo -create \
            artifacts/ios-aarch64-apple-ios-sim/libhyperswarm_mobile.a \
            artifacts/ios-x86_64-apple-ios/libhyperswarm_mobile.a \
            -output output/ios/simulator/libhyperswarm_mobile.a || \
          cp artifacts/ios-aarch64-apple-ios-sim/libhyperswarm_mobile.a output/ios/simulator/

          # Copy header
          cp native/hyperswarm-mobile/include/hyperswarm.h output/

      - name: Create XCFramework
        run: |
          cd output/ios
          xcodebuild -create-xcframework \
            -library device/libhyperswarm_mobile.a -headers ../hyperswarm.h \
            -library simulator/libhyperswarm_mobile.a -headers ../hyperswarm.h \
            -output HyperswarmMobile.xcframework || echo "XCFramework creation skipped on Linux"

      - name: Upload packaged libraries
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: hyperswarm-native-libraries
          path: output/

  release:
    name: Create Release
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged libraries
        uses: actions/download-artifact@v4
        with:
          name: hyperswarm-native-libraries
          path: native-libs

      - name: Create tarball
        run: |
          cd native-libs
          tar -czvf ../hyperswarm-native-libs.tar.gz .

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: native-libs-${{ steps.sha.outputs.short }}
          name: Native Libraries (${{ steps.sha.outputs.short }})
          body: |
            Automated build of Hyperswarm native libraries.

            Commit: ${{ github.sha }}

            Contains:
            - Android: arm64-v8a, armeabi-v7a, x86_64, x86
            - iOS: device (arm64), simulator (arm64 + x86_64)
          files: hyperswarm-native-libs.tar.gz
          prerelease: true
