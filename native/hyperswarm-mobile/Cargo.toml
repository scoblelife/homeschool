[package]
name = "hyperswarm-mobile"
version = "0.1.0"
edition = "2021"
description = "Native Hyperswarm implementation for iOS and Android"
license = "MIT"

[lib]
name = "hyperswarm_mobile"
crate-type = ["staticlib", "cdylib"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }

# Noise Protocol for encryption
snow = "0.9"

# DHT and networking
sha2 = "0.10"
rand = "0.8"
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.10"

# For C FFI
libc = "0.2"
once_cell = "1"

# Error handling
thiserror = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
jni = { version = "0.21", features = ["invocation"] }

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

[profile.release]
lto = true
opt-level = "z"
strip = true
