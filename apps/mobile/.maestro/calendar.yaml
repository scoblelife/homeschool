appId: com.scoblelife.homeschool
---
# Calendar Flow: month navigation, date selection, day details
# Tests calendar browsing and activity viewing

- launchApp

# Navigate to Calendar via More menu
- tapOn: "More"
- tapOn: "Calendar"

# Verify calendar screen loaded with day headers
- assertVisible: "Sun"
- assertVisible: "Mon"
- assertVisible: "Tue"
- assertVisible: "Wed"
- assertVisible: "Thu"
- assertVisible: "Fri"
- assertVisible: "Sat"

# Navigate to previous month
- tapOn: "Previous month"

# Navigate forward twice to next month
- tapOn: "Next month"
- tapOn: "Next month"

# Navigate back to current month
- tapOn: "Previous month"

# Tap a date in the middle of the calendar
- tapOn:
    text: "15"
    optional: true

# Scroll down to see day details
- scroll:
    direction: DOWN

# Navigate back via More
- tapOn: "More"
- assertVisible: "Calendar"
