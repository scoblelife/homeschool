appId: com.scoblelife.homeschool
---
# Milestone Status Flow: view → filter → change status
# Tests milestone tracking lifecycle

- launchApp

# Navigate to Milestones via More menu
- tapOn: "More"
- tapOn: "Milestones"

# Verify milestones screen
- assertVisible: "Progress"

# Check filter tabs exist
- assertVisible: "All"
- assertVisible: "In Progress"
- assertVisible: "Not Started"

# Filter to Not Started
- tapOn: "Not Started"

# Tap a milestone if available
- tapOn:
    text: ".*"
    index: 0
    optional: true

# Try starting it
- tapOn:
    text: "Start Working"
    optional: true

# Go back
- back:
    optional: true

# Check In Progress filter
- tapOn: "In Progress"

# Try completing a milestone
- tapOn:
    text: ".*"
    index: 0
    optional: true

- tapOn:
    text: "Mark as Complete"
    optional: true

# Go back
- back:
    optional: true

# Check Completed filter
- tapOn: "Completed"

# Return to All view
- tapOn: "All"

# Check star totals
- scroll:
    direction: UP
