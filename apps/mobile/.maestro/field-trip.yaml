appId: com.scoblelife.homeschool
---
# Field Trip Flow: create trip → fill form → save
# Tests field trip planning feature

- launchApp

# Navigate to Field Trips via More menu
- tapOn: "More"
- tapOn: "Events & Field Trips"

# Add a new field trip
- tapOn:
    text: "+"
    optional: true
- tapOn:
    text: "Add"
    optional: true
- tapOn:
    text: "Plan"
    optional: true

# Fill in trip details
- tapOn:
    text: "Title"
    optional: true
- inputText: "Natural History Museum"
- hideKeyboard

- tapOn:
    text: "Location"
    optional: true
- inputText: "Las Vegas, NV"
- hideKeyboard

# Select educational category
- tapOn:
    text: "Educational"
    optional: true

# Save the trip
- tapOn:
    text: "Save"
    optional: true
- tapOn:
    text: "Create"
    optional: true
- tapOn:
    text: "Add"
    optional: true

# Verify trip appears
- assertVisible:
    text: "Natural History Museum"
    optional: true

# Go back
- back:
    optional: true
