appId: com.scoblelife.homeschool
---
# Library Flow: add book → log reading → mark finished
# Tests reading tracking lifecycle

- launchApp

# Navigate to Library via More menu
- tapOn: "More"
- tapOn: "Library"
- assertVisible: "Library"

# Add a new book
- tapOn: "Add Book"

# Fill in book details
- tapOn:
    text: "Title"
    optional: true
- inputText: "Charlotte's Web"
- hideKeyboard

- tapOn:
    text: "Author"
    optional: true
- inputText: "E.B. White"
- hideKeyboard

- tapOn:
    text: "Total Pages"
    optional: true
- inputText: "184"
- hideKeyboard

# Save the book
- tapOn: "Add"

# Verify book appears in list
- assertVisible: "Charlotte's Web"

# Tap on the book to see details
- tapOn: "Charlotte's Web"

# Change status to Reading
- tapOn: "Reading"

# Log some reading progress
- tapOn: "Log Reading"
- tapOn: "How many pages"
- inputText: "45"
- hideKeyboard
- tapOn: "Log"

# Mark as finished
- tapOn: "Completed"

# Go back to library list
- back:
    optional: true

# Verify with Finished filter
- tapOn: "Finished"
- assertVisible: "Charlotte's Web"
