appId: com.scoblelife.homeschool
---
# Quick Repeat Flow: tap a recent template to re-log
# Tests the quick-repeat shortcut

- launchApp

# Navigate to Log tab
- tapOn: "Log"

# First log an activity so we have a template
- tapOn: "What did you do?"
- inputText: "Reading practice 15min"
- hideKeyboard
- tapOn: "Log activity"

# Wait for the template to appear in recent section
- scroll:
    direction: DOWN

# Tap the quick repeat template
- tapOn:
    text: "Reading practice"
    index: 0
    optional: true

# Should auto-fill or quick-log
- assertVisible: "What did you do?"
