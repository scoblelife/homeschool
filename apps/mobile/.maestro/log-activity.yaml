appId: com.scoblelife.homeschool
---
# Activity Logging Flow: text input → parse → verify on Today
# Tests the primary daily workflow

- launchApp

# Navigate to Log tab
- tapOn: "Log"

# Verify Log screen loaded
- assertVisible: "What did you do?"

# Type activity with smart parse format
- tapOn: "What did you do?"
- inputText: "Math worksheet chapter 5 30min"
- hideKeyboard

# Expand details to verify parsed fields
- tapOn: "Show activity details"

# Select activity type
- tapOn: "Worksheet"

# Tap Log button
- tapOn: "Log activity"

# Verify success - input should be cleared
- assertVisible: "What did you do?"

# Log another activity with different type
- tapOn: "What did you do?"
- inputText: "Watched science video about volcanoes 20min"
- hideKeyboard

- tapOn: "Show activity details"
- tapOn: "Video"
- tapOn: "Log activity"

# Navigate to Today tab to verify activities appear
- tapOn: "Today"
- assertVisible: "Today's Activities"
