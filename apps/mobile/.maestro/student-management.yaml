appId: com.scoblelife.homeschool
---
# Student Management Flow: switch students, verify data isolation
# Tests multi-student support

- launchApp

# Should be on Today tab
- assertVisible: "Today"

# Open student selector to switch students
- tapOn:
    text: "Alice"
    optional: true

# Switch to second student
- tapOn:
    text: "Bob"
    optional: true

# Verify the screen updates
- assertVisible: "Today"

# Navigate to Settings
- tapOn: "More"
- tapOn: "Settings"
- assertVisible: "Settings"
- assertVisible: "Students"

# Go back
- back

# Switch back to first student via Today
- tapOn: "Today"
- tapOn:
    text: "Bob"
    optional: true
- tapOn:
    text: "Alice"
    optional: true

- assertVisible: "Today"
