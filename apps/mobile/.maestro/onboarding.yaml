appId: com.scoblelife.homeschool
---
# Onboarding Flow: carousel → add student → select state
# Verifies complete first-run experience

- launchApp

# Slide 1: Welcome
- assertVisible: "Welcome to Homeschool"
- tapOn: "Next"

# Slide 2: Log Learning
- assertVisible: "Log Learning Instantly"
- tapOn: "Next"

# Slide 3: Celebrate Progress
- assertVisible: "Celebrate Progress"
- tapOn: "Next"

# Slide 4: Stay Compliant - final slide
- assertVisible: "Stay Compliant"
- tapOn: "Get Started"

# Student Setup Screen
- assertVisible: "Add Your Students"

# Fill in first student name
- tapOn: "Student's name"
- inputText: "Alice"
- hideKeyboard

# Select grade
- tapOn: "3rd Grade"

# Select color (fuchsia is default, select teal for visibility)
- tapOn:
    id: "color-Teal"

# Add second student
- tapOn: "Add another student"

# Fill second student
- scrollUntilVisible:
    element: "Student's name"
    direction: DOWN
- tapOn:
    text: "Student's name"
    index: 1
- inputText: "Bob"
- hideKeyboard

- tapOn: "5th Grade"

# Continue to state selection
- tapOn: "Continue"

# State Selection Screen
- assertVisible: "Select Your State"

# Search for Nevada
- tapOn: "Search states..."
- inputText: "Nevada"

# Select Nevada
- tapOn: "Nevada"

# Finish setup
- tapOn: "Finish Setup"

# Should land on Today tab
- assertVisible: "Today"
