[package]
name = "homeschool-api"
version = "0.1.0"
edition = "2021"
description = "Lesson Plan API + Content Moderation Service"

[dependencies]
# Web + gRPC
axum = "0.7"
tonic = "0.12"
tonic-web = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower = "0.4"
http = "1"
hyper = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
